# Environment
env=XCURSOR_SIZE,25
env=QT_QPA_PLATFORM,wayland
env=GDK_BACKEND,wayland,x11
env=MOZ_ENABLE_WAYLAND,1

# Startup applications
exec_once=awww-daemon
exec_once=waybar
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=wl-clip_persist --clipboard regular

# Monitors
monitor_rule=name:^HDMI-A-1$,width:2560,height:1440,refresh:144,x:2560,y:0,scale:1,primary:1

# Layout and gaps
sloppy_focus=1
tag_rule=id:*,layout_name:dwindle
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=0
dwindle_vertical_split=0
dwindle_preserve_split=1

# Appearance
border_px=1
focus_color=0x8888888ff
border_color=0x141414ff
root_color=0x000000ff
border_radius=3
focused_opacity=0.90
unfocused_opacity=0.80

# Shadows
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=8
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000aa

# Blur
blur=1
blur_layer=1
blur_optimized=1

blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Animations
animations=1
layer_animations=1

animation_type_open=slide
animation_type_close=slide

animation_fade_in=1
animation_fade_out=1

fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.8

animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
animation_duration_open=350
animation_duration_close=250
animation_duration_move=350
animation_duration_tag=300
animation_duration_focus=250

animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1

# Keyboard
xkb_rules_layout=us,bg
xkb_rules_variant=,phonetic
xkb_rules_options=grp:alt_shift_toggle

# Mouse and touchpad
mouse_accel_profile=1
mouse_accel_speed=-0.8
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1

# Key bindings
bind=SUPER,Return,spawn,foot
bind=SUPER,E,spawn,thunar
bind=SUPER,space,spawn,rofi -show drun

# Window management
bind=SUPER,Q,killclient
bind=SUPER,F11,togglefullscreen
bindl=SUPER,L,spawn,systemctl suspend

# Move focused window in the dwindle layout
bind=SUPER,W,move_client,up
bind=SUPER,S,move_client,down
bind=SUPER,A,move_client,left
bind=SUPER,D,move_client,right

# Cycle windows
bind=ALT,Tab,focusstack,next

# Screenshot
bind=NONE,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot.png

# Volume
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Reload config: Super + M
bind=SUPER,M,reload_config
